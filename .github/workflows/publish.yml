name: Release

# Release the version in package.json: create the GitHub release with the
# notes from CHANGELOG.md and publish the package to npm. Either push a tag
# named after the version (e.g. v4.0.0), or run this workflow manually on
# main, which creates the tag along with the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Determine the version
        id: version
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $VERSION in package.json."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm test

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          # The section "## <version without v>" up to the next "## " heading
          awk -v v="${VERSION#v}" '
            /^## / { if (found) exit; found = (index($0, "## " v) == 1); next }
            found' CHANGELOG.md > release-notes.md
          # Creates the tag on the tested commit unless it exists already
          if [ -s release-notes.md ]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node.js 24
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Publish to npm
        run: |
          if [ -n "$(npm view "$(node -p 'require("./package.json").name')@${VERSION#v}" version 2>/dev/null)" ]; then
            echo "$VERSION is already on npm."
            exit 0
          fi
          npm publish
        env:
          VERSION: ${{ needs.test.outputs.version }}
