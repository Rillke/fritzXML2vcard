version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: uglify-js
    versions:
    - 3.12.5
    - 3.13.0
    - 3.13.2
  - dependency-name: clipboard
    versions:
    - 2.0.7
  - dependency-name: jasmine
    versions:
    - 3.6.4
  # 2.11 drops CHARSET=UTF-8 from the vCards, which Outlook needs to read
  # umlauts correctly, and writes untyped numbers as VOICE instead of OTHER.
  # See https://github.com/Rillke/fritzXML2vcard/pull/174
  - dependency-name: vcards-js
    versions:
    - ">= 2.11.0"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
